<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">Held-out calibration on synthetic data</title><desc id="desc">Five probability bins compare mean predicted churn with observed churn. Sample sizes are small; proximity to the diagonal is not a guarantee of future calibration.</desc>
<rect width="560" height="360" fill="#faf8f2"/><g fill="#183d37" font-family="sans-serif" font-size="13">
<text x="30" y="30" font-size="18">Calibration, held-out synthetic customers</text><path d="M70 60V290H480" fill="none" stroke="#7c8983"/><path d="M70 290L480 60" fill="none" stroke="#b1b9b4" stroke-dasharray="5 5"/>
<text x="64" y="310">0</text><text x="475" y="310">1</text><text x="45" y="65">1</text><text x="45" y="295">0</text><text x="160" y="339">Mean predicted probability</text><text transform="translate(22 255) rotate(-90)">Observed churn proportion</text><circle cx="109.29" cy="265.14" r="6" fill="#237b67"><title>37 synthetic customers; predicted 0.096, observed 0.108</title></circle><circle cx="191.67" cy="179.26" r="6" fill="#237b67"><title>27 synthetic customers; predicted 0.297, observed 0.481</title></circle><circle cx="276.21" cy="221.00" r="6" fill="#237b67"><title>20 synthetic customers; predicted 0.503, observed 0.300</title></circle><circle cx="356.65" cy="143.64" r="6" fill="#237b67"><title>22 synthetic customers; predicted 0.699, observed 0.636</title></circle><circle cx="439.42" cy="86.14" r="6" fill="#237b67"><title>44 synthetic customers; predicted 0.901, observed 0.886</title></circle></g></svg>