<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title desc"><title id="title">Expected contribution at three simulated prices</title><desc id="desc">Price 20 converts 30 percent and contributes 3 per opportunity; price 25 converts 24 percent and contributes 3.6; price 30 converts 15 percent and contributes 3. The highest conversion is not the highest contribution.</desc><rect width="560" height="350" fill="#faf8f2"/><g fill="#183d37" font-family="sans-serif" font-size="14"><text x="30" y="32" font-size="18">Simulated contribution per opportunity</text><path d="M70 60V280H500" stroke="#7c8983" fill="none"/><rect x="95" y="130.0" width="68" height="150.0" fill="#237b67"/><text x="129" y="118.0" text-anchor="middle">3.00</text><text x="129" y="305" text-anchor="middle">Price 20</text><rect x="235" y="100.0" width="68" height="180.0" fill="#237b67"/><text x="269" y="88.0" text-anchor="middle">3.60</text><text x="269" y="305" text-anchor="middle">Price 25</text><rect x="375" y="130.0" width="68" height="150.0" fill="#237b67"/><text x="409" y="118.0" text-anchor="middle">3.00</text><text x="409" y="305" text-anchor="middle">Price 30</text><text x="100" y="335">Fictional units; assumed probabilities, not measured demand</text></g></svg>